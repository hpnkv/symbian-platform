<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Symbian Console</title>
  <style>/* __CONSOLE_STYLE__ */</style>
</head>
<body>
  <div id="app" class="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <nav id="navigation" class="navigation"></nav>
      <section id="selection" class="selection-panel" aria-label="Current selection"></section>
    </aside>
    <main id="main" class="main-content" tabindex="-1">
      <div class="loading-state"><span class="spinner" aria-hidden="true"></span>Connecting to the local SDK…</div>
    </main>
    <aside id="context-panel" class="context-panel" aria-label="View options" hidden></aside>
    <footer class="statusbar" role="status" aria-live="polite">
      <span id="work-status">Connecting to the local SDK…</span>
      <span id="device-status"></span>
    </footer>
  </div>
  <script>/* __CONSOLE_RESULTS__ */</script>
  <script>/* __CONSOLE_LIVE__ */</script>
  <script>/* __CONSOLE_SCRIPT__ */</script>
</body>
</html>
