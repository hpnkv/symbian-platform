[project]
name = "agent_service"
kind = "e32-import"
cmake_preset = "symbian-pic"
uid3 = 0xe0000a31
capabilities = ["NetworkServices", "ReadUserData", "WriteUserData"]
import_proxies = [
  "${sdk}/proxies/euser/euser.dso",
  "${sdk}/proxies/libc/libc.dso",
  "${sdk}/proxies/libpthread/libpthread.dso",
  "${sdk}/proxies/libm/libm.dso",
  "${sdk}/proxies/drtaeabi/drtaeabi.dso",
  "${sdk}/proxies/esock/esock.dso",
  "${sdk}/proxies/insock/insock.dso",
  "${sdk}/proxies/hal/hal.dso",
  "${sdk}/proxies/ws32/ws32.dso",
  "${sdk}/proxies/gdi/gdi.dso",
  "${sdk}/proxies/fbscli/fbscli.dso",
  "${sdk}/proxies/efsrv/efsrv.dso",
]

[package]
uid = 0xe0000a32
name = "Symbian Development Agent"
vendor = "Symbian SDK"
executable_name = "agent_service.exe"
version = [1, 2, 7]

[application]
caption = "Development Agent"
short_caption = "Agent"
