# Host SDK build/test infrastructure follows A11's separate native/wheel gates.
name: Linux host SDK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cpp/**", "symbian/**", "CMake*", "pyproject.toml", "scripts/**", ".github/workflows/host-linux.yml"]
  pull_request:
    paths: ["cpp/**", "symbian/**", "CMake*", "pyproject.toml", "scripts/**", ".github/workflows/host-linux.yml"]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl autoconf automake libtool pkg-config curl
      - run: python -m pip install "cmake>=3.28" ninja
      - run: scripts/bootstrap_wheel_deps.sh
        env:
          SYMBIAN_DEPS_PREFIX: ${{ runner.temp }}/symbian-deps
      - run: |
          cmake --preset debug
          cmake --build --preset debug --parallel 4
          ctest --preset debug
        env:
          SYMBIAN_DEPS_PREFIX: ${{ runner.temp }}/symbian-deps
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "cibuildwheel==4.1.1"
      - run: python -m cibuildwheel --platform linux --archs "${{ matrix.arch }}" --output-dir wheelhouse
        env:
          SYMBIAN_DEPS_PREFIX: /opt/symbian-deps
          SYMBIAN_WHEEL_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: host-wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
