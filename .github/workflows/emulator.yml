name: Emulator
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      reuse_run_id:
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["research/eka2l1/**", "cpp/symbian/emulator/**", "scripts/*emulator*.py", "scripts/bundle_native_sdk.py", ".github/workflows/emulator.yml"]
  pull_request:
    paths: ["research/eka2l1/**", "cpp/symbian/emulator/**", "scripts/*emulator*.py", "scripts/bundle_native_sdk.py", ".github/workflows/emulator.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qt-sources:
    if: inputs.reuse_run_id == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .symbian/emulator-sources/qt-everywhere-src-6.8.3.tar.xz
          key: emulator-qt-source-683-v1
      - name: Acquire corresponding Qt sources and notices once
        run: python scripts/emulator_sources.py qt --workspace .symbian/emulator-sources
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-qt-notices
          path: .symbian/emulator-sources/qt-notices
          if-no-files-found: error
  build:
    if: inputs.reuse_run_id == ''
    needs: qt-sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: linux
            arch: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
          - runner: ubuntu-24.04-arm
            system: linux
            arch: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
          - runner: macos-15
            system: macos
            arch: arm64
            qt_host: mac
            qt_arch: clang_64
          - runner: macos-15-intel
            system: macos
            arch: x86_64
            qt_host: mac
            qt_arch: clang_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select disposable build workspace
        shell: bash
        run: echo "EMULATOR_WORKSPACE=$RUNNER_TEMP/symbian-emulator" >> "$GITHUB_ENV"
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build nasm pkg-config \
            libsdl2-dev libpulse-dev libasound2-dev libvulkan-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxi-dev libxrandr-dev \
            libxrender-dev libxcb-cursor0 libxkbcommon-x11-0 libegl1 \
            libopengl0 xvfb patchelf
      - name: Install macOS build prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake ninja nasm
      - name: Install pinned Qt frontend modules
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Restore pinned source checkout
        id: source
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.EMULATOR_WORKSPACE }}/source
          key: emulator-source-v1-${{ matrix.system }}-${{ matrix.arch }}-${{ hashFiles('scripts/build_emulator.py', 'research/eka2l1/*.patch') }}
      - name: Acquire and check exact patched sources
        run: python scripts/build_emulator.py acquire --workspace "$EMULATOR_WORKSPACE"
      - uses: actions/cache/save@v4
        if: steps.source.outputs.cache-hit != 'true'
        with:
          path: ${{ env.EMULATOR_WORKSPACE }}/source
          key: ${{ steps.source.outputs.cache-primary-key }}
      - name: Restore native FFmpeg
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.EMULATOR_WORKSPACE }}/dependencies/ffmpeg
          key: emulator-ffmpeg-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('scripts/build_emulator.py', 'research/eka2l1/ffmpeg-linux-compat.patch') }}
      - name: Compile native FFmpeg once per host
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: python scripts/build_emulator.py ffmpeg --workspace "$EMULATOR_WORKSPACE" --jobs 4
      - uses: actions/cache/save@v4
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        with:
          path: ${{ env.EMULATOR_WORKSPACE }}/dependencies/ffmpeg
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}
      - name: Restore native SDL
        id: sdl
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.EMULATOR_WORKSPACE }}/dependencies/sdl
            ${{ env.EMULATOR_WORKSPACE }}/SDL2-2.30.11.tar.gz
            ${{ env.EMULATOR_WORKSPACE }}/SDL2-2.30.11
          key: emulator-sdl-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('scripts/build_emulator.py') }}
      - name: Compile SDL from source once per host
        if: steps.sdl.outputs.cache-hit != 'true'
        run: python scripts/build_emulator.py sdl --workspace "$EMULATOR_WORKSPACE" --jobs 4
      - uses: actions/cache/save@v4
        if: steps.sdl.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ env.EMULATOR_WORKSPACE }}/dependencies/sdl
            ${{ env.EMULATOR_WORKSPACE }}/SDL2-2.30.11.tar.gz
            ${{ env.EMULATOR_WORKSPACE }}/SDL2-2.30.11
          key: ${{ steps.sdl.outputs.cache-primary-key }}
      - name: Restore compiled emulator core
        id: core
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.EMULATOR_WORKSPACE }}/build
          key: emulator-core-v1-${{ matrix.runner }}-${{ matrix.arch }}-qt683-${{ hashFiles('scripts/build_emulator.py', 'research/eka2l1/**', 'cpp/symbian/emulator/**') }}
      - name: Configure native frontend and SDK adapters
        run: python scripts/build_emulator.py configure --workspace "$EMULATOR_WORKSPACE" --qt-prefix "$QT_ROOT_DIR"
      - name: Build both CPU backends, frontend and firmware importer
        run: python scripts/build_emulator.py build --workspace "$EMULATOR_WORKSPACE" --jobs 4
      - name: Run upstream native tests
        run: python scripts/build_emulator.py test --workspace "$EMULATOR_WORKSPACE"
      - name: Check actual display-independent SDK contract
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            frontend="$EMULATOR_WORKSPACE/build/bin/EKA2L1.app/Contents/MacOS/EKA2L1"
          else
            frontend="$EMULATOR_WORKSPACE/build/bin/eka2l1_qt"
          fi
          "$frontend" --symbian-sdk-capabilities
      - uses: actions/cache/save@v4
        if: steps.core.outputs.cache-hit != 'true'
        with:
          path: ${{ env.EMULATOR_WORKSPACE }}/build
          key: ${{ steps.core.outputs.cache-primary-key }}
      - uses: actions/download-artifact@v4
        with:
          name: emulator-qt-notices
          path: ${{ env.EMULATOR_WORKSPACE }}/qt-notices
      - name: Acquire source and notices for Qt's optional ICU runtime
        run: python scripts/emulator_sources.py icu --workspace "$EMULATOR_WORKSPACE" --qt-prefix "$QT_ROOT_DIR"
      - name: Deploy Qt and non-system runtime libraries
        run: |
          python scripts/bundle_emulator.py --workspace "$EMULATOR_WORKSPACE" \
            --qt-prefix "$QT_ROOT_DIR" --qt-source "$EMULATOR_WORKSPACE/qt-notices" \
            --output "$EMULATOR_WORKSPACE/delivered bundle"
      - name: Check relocated archive and native Qt startup
        shell: bash
        run: |
          archive=("$EMULATOR_WORKSPACE"/symbian-emulator-*.tar.gz)
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python scripts/check_emulator_bundle.py "${archive[0]}"
          else
            python scripts/check_emulator_bundle.py "${archive[0]}"
          fi
      - name: Collect corresponding runtime sources and rebuild recipes
        shell: bash
        run: |
          version=$(cat research/eka2l1/VERSION)
          runtime="$EMULATOR_WORKSPACE/runtime-sources"
          python scripts/emulator_sources.py runtime --workspace "$EMULATOR_WORKSPACE" \
            --prefix "$EMULATOR_WORKSPACE/delivered bundle" --output "$runtime"
          for source in "$EMULATOR_WORKSPACE"/icu4c-*-src.tgz; do
            if [[ -f "$source" ]]; then cp "$source" "$runtime/"; fi
          done
          tar -czf "$EMULATOR_WORKSPACE/symbian-emulator-runtime-source-$version-${{ matrix.system }}-${{ matrix.arch }}.tar.gz" \
            -C "$runtime" .
      - name: Export shared patched emulator and dependency sources
        if: matrix.system == 'linux' && matrix.arch == 'x86_64'
        run: |
          python scripts/emulator_sources.py snapshot --workspace "$EMULATOR_WORKSPACE" \
            --output "$EMULATOR_WORKSPACE/emulator-core-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: matrix.system == 'linux' && matrix.arch == 'x86_64'
        with:
          name: emulator-core-source
          path: ${{ env.EMULATOR_WORKSPACE }}/emulator-core-source.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-bundle-${{ matrix.system }}-${{ matrix.arch }}
          path: |
            ${{ env.EMULATOR_WORKSPACE }}/symbian-emulator-*.tar.gz
            ${{ env.EMULATOR_WORKSPACE }}/symbian-emulator-*.json
          if-no-files-found: error
  sources:
    if: inputs.reuse_run_id == ''
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .symbian/emulator-sources/qt-everywhere-src-6.8.3.tar.xz
          key: emulator-qt-source-683-v1
      - uses: actions/download-artifact@v4
        with:
          name: emulator-core-source
          path: .symbian/emulator-sources
      - name: Combine common corresponding source once
        run: |
          version=$(cat research/eka2l1/VERSION)
          python scripts/emulator_sources.py complete --workspace .symbian/emulator-sources \
            --snapshot .symbian/emulator-sources/emulator-core-source.tar.gz \
            --output "symbian-emulator-source-$version.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-corresponding-source
          path: symbian-emulator-source-*.tar.gz
          if-no-files-found: error
  reuse:
    if: inputs.reuse_run_id != ''
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        artifact:
          - emulator-bundle-linux-x86_64
          - emulator-bundle-linux-aarch64
          - emulator-bundle-macos-x86_64
          - emulator-bundle-macos-arm64
          - emulator-corresponding-source
    steps:
      - name: Check exact-source producer before reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_run_id }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          run = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['REUSE_RUN']}"
          ]))
          if (run["head_sha"] != os.environ["GITHUB_SHA"] or run["conclusion"] != "success"
              or run["path"] not in {".github/workflows/emulator.yml", ".github/workflows/emulator-release.yml"}):
              raise SystemExit("Emulator producer is not tested at this source commit")
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          path: reused
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: reused/*
          if-no-files-found: error
